# Realism defects injected into the raw files, each logged in the answer key with the row it affects
defects:
  deals:
    exact_duplicate_share: 0.02       # resubmitted rows
    near_duplicate_share: 0.01        # tenant spelt differently, same deal
    missing_submarket_share: 0.015    # submarket blank (derivable from the building)
    wrong_rent_unit_share: 0.005      # monthly market with an annual figure (12x) or vice versa
    wrong_area_unit_share: 0.004      # London row in m2 instead of sq ft
    future_date_share: 0.002          # typo in the year
    confidential_rent_share: 0.02     # rent withheld: not a defect, documented
  market_stats:
    resubmitted_quarters: 2           # a market-quarter submitted twice; the later submission wins
    vacancy_mismatch_quarters: 1      # reported vacancy diverges from the building bottom-up by > 2pp (reconciliation warning)
  buildings:
    refurbished_resubmissions: 6      # a building sent twice with a later last_updated and a new grade
    missing_grade_share: 0.03
