# Illustrative market assumptions for the synthetic data. These are NOT market data: the levels are
# plausible for 2026 office markets but are chosen to exercise the pipeline (units, currencies,
# conventions, reconciliations), not to describe any market. Every number the pipeline reports
# comes from here plus documented noise, so the "answer key" is reproducible.
#
# rent_unit is the convention the market reports in: per_sqft_year (GBP), per_m2_year (EUR), per_m2_month (EUR).
# vacancy values are rates of stock; take_up is quarterly, in the market's own area unit AFTER conversion to m2 here
# (the generator converts to the market's reporting unit when it writes the files).

